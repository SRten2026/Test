<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FPV Receiver with Directional Voice HUD</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; position: relative; }
    #video-wrapper {
      position: absolute; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; z-index: 1;
    }
    video {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.2s ease;
    }
    canvas { width: 100%; height: 100%; position: absolute; z-index: 2; pointer-events: none; }
    #bar {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(0, 0, 0, 0.75); padding: 6px 10px; border-radius: 4px; border: 1px solid #00ff00;
      display: flex; gap: 6px; align-items: center;
    }
    input, button { background: #111; color: #00ff00; border: 1px solid #00ff00; padding: 5px 8px; font-family: monospace; font-size: 12px; }
    button { cursor: pointer; font-weight: bold; }
    .btn-active { background: #00ff00 !important; color: #000 !important; }
  </style>
</head>
<body>

  <div id="bar">
    <input type="text" id="targetId" value="plane77" style="width: 75px;">
    <button id="connectBtn">CONNECT</button>
    <button id="rotateBtn" title="Rotate Camera">🔄 0°</button>
    <button id="invertBtn" title="Invert Pitch">↕️ INV: OFF</button>
    <button id="audioBtn" class="btn-active">🔊 AUDIO: ON</button>
  </div>

  <div id="video-wrapper">
    <video id="planeVideo" autoplay playsinline muted></video>
  </div>
  <canvas id="hudCanvas"></canvas>

  <script>
    const video = document.getElementById('planeVideo');
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');
    const rotateBtn = document.getElementById('rotateBtn');
    const invertBtn = document.getElementById('invertBtn');
    const audioBtn = document.getElementById('audioBtn');

    let tele = { roll: 0, pitch: 0, heading: 0 };
    let peer = null;
    let rotationAngle = 0;
    let isPitchInverted = false;
    let audioAlertsEnabled = true;
    let lastSpokenTime = 0;
    let activeWarningText = "";

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 1. Audio Voice Warning Engine
    function triggerVoiceAlert(message) {
      if (!audioAlertsEnabled) return;
      const now = Date.now();
      if (now - lastSpokenTime < 3500) return; // 3.5s cooldown

      lastSpokenTime = now;
      activeWarningText = message.toUpperCase();

      const utterance = new SpeechSynthesisUtterance(message);
      utterance.rate = 1.1;
      utterance.pitch = 0.9;
      utterance.volume = 1.0;
      window.speechSynthesis.speak(utterance);

      setTimeout(() => { activeWarningText = ""; }, 3000);
    }

    // 2. Flight Limit Evaluation (Left / Right Directional Logic)
    function evaluateFlightSafety() {
      let roll = tele.roll; // Negative is Left, Positive is Right
      let pitch = isPitchInverted ? -tele.pitch : tele.pitch;

      if (roll > 45) {
        triggerVoiceAlert("Bank Angle Right");
      } else if (roll < -45) {
        triggerVoiceAlert("Bank Angle Left");
      } else if (pitch < -25) {
        triggerVoiceAlert("Pull Up");
      } else if (pitch > 35) {
        triggerVoiceAlert("Caution Stall");
      }
    }

    // UI Buttons
    audioBtn.addEventListener('click', () => {
      audioAlertsEnabled = !audioAlertsEnabled;
      audioBtn.innerText = audioAlertsEnabled ? "🔊 AUDIO: ON" : "🔇 AUDIO: OFF";
      audioBtn.classList.toggle('btn-active', audioAlertsEnabled);
    });

    rotateBtn.addEventListener('click', () => {
      rotationAngle = (rotationAngle + 90) % 360;
      rotateBtn.innerText = `🔄 ${rotationAngle}°`;
      video.style.transform = `rotate(${rotationAngle}deg)`;
      
      if (rotationAngle === 90 || rotationAngle === 270) {
        video.style.width = '100vh';
        video.style.height = '100vw';
      } else {
        video.style.width = '100%';
        video.style.height = '100%';
      }
    });

    invertBtn.addEventListener('click', () => {
      isPitchInverted = !isPitchInverted;
      invertBtn.innerText = isPitchInverted ? "↕️ INV: ON" : "↕️ INV: OFF";
      invertBtn.classList.toggle('btn-active', isPitchInverted);
    });

    function getDirectionLabel(deg) {
      if (deg === 0 || deg === 360) return 'N';
      if (deg === 45) return 'NE';
      if (deg === 90) return 'E';
      if (deg === 135) return 'SE';
      if (deg === 180) return 'S';
      if (deg === 225) return 'SW';
      if (deg === 270) return 'W';
      if (deg === 315) return 'NW';
      return deg.toString();
    }

    // Draw HUD Canvas
    function drawHUD() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      evaluateFlightSafety();

      // ==========================================
      // 1. TOP PUBG STYLE COMPASS
      // ==========================================
      const compWidth = 340;
      const compX = cx - compWidth / 2;
      const compY = 16;
      const compH = 32;
      const fovDeg = 90;
      const pxPerDeg = compWidth / fovDeg;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(compX, compY, compWidth, compH);
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(compX, compY, compWidth, compH);

      ctx.fillStyle = '#00ff00';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      let currentHdg = (tele.heading || 0);
      ctx.fillText(`HDG ${currentHdg.toString().padStart(3, '0')}°`, cx, compY - 4);

      ctx.save();
      ctx.beginPath();
      ctx.rect(compX, compY, compWidth, compH);
      ctx.clip();

      for (let deg = 0; deg < 360; deg += 5) {
        let diff = deg - currentHdg;
        while (diff < -180) diff += 360;
        while (diff > 180) diff -= 360;

        let xPos = cx + (diff * pxPerDeg);

        if (xPos >= compX - 20 && xPos <= compX + compWidth + 20) {
          const isCardinal = (deg % 45 === 0);
          const isMajorTick = (deg % 15 === 0);

          if (isCardinal || isMajorTick) {
            let label = getDirectionLabel(deg);
            ctx.fillStyle = (label === 'N') ? '#ff4444' : '#00ff00';
            ctx.fillRect(xPos - 1, compY + compH - 10, 2, 10);

            ctx.font = isCardinal ? 'bold 11px monospace' : '9px monospace';
            ctx.fillText(label, xPos, compY + 14);
          } else {
            ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
            ctx.fillRect(xPos - 0.5, compY + compH - 5, 1, 5);
          }
        }
      }
      ctx.restore();

      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.moveTo(cx, compY + compH);
      ctx.lineTo(cx - 5, compY + compH + 7);
      ctx.lineTo(cx + 5, compY + compH + 7);
      ctx.fill();

      // ==========================================
      // 2. ARTIFICIAL HORIZON & PITCH LADDER
      // ==========================================
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((tele.roll * Math.PI) / 180);

      let currentPitch = isPitchInverted ? -tele.pitch : tele.pitch;
      const pitchPx = currentPitch * 6;

      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-180, pitchPx);
      ctx.lineTo(180, pitchPx);
      ctx.stroke();

      ctx.lineWidth = 1.5;
      for (let p = -30; p <= 30; p += 10) {
        if (p === 0) continue;
        let y = pitchPx - (p * 6);
        let len = 35;

        ctx.beginPath();
        ctx.moveTo(-len, y); ctx.lineTo(-len + 12, y);
        ctx.moveTo(len - 12, y); ctx.lineTo(len, y);
        ctx.stroke();

        ctx.fillStyle = '#00ff00';
        ctx.font = '11px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(p + '°', len + 6, y + 4);
        ctx.textAlign = 'right';
        ctx.fillText(p + '°', -len - 6, y + 4);
      }
      ctx.restore();

      // ==========================================
      // 3. FIXED RETICLE (YELLOW CROSSHAIR)
      // ==========================================
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 30, cy); ctx.lineTo(cx - 10, cy);
      ctx.moveTo(cx + 10, cy); ctx.lineTo(cx + 30, cy);
      ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8);
      ctx.stroke();

      // ==========================================
      // 4. ON-SCREEN VISUAL ALERT BANNER
      // ==========================================
      if (activeWarningText) {
        ctx.fillStyle = 'rgba(255, 0, 0, 0.75)';
        ctx.fillRect(cx - 140, cy + 50, 280, 36);
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2;
        ctx.strokeRect(cx - 140, cy + 50, 280, 36);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`⚠️ ${activeWarningText}`, cx, cy + 74);
      }

      requestAnimationFrame(drawHUD);
    }
    drawHUD();

    // Connect logic
    document.getElementById('connectBtn').addEventListener('click', () => {
      const target = document.getElementById('targetId').value.trim().toLowerCase();
      if (!target) return;

      if (window.speechSynthesis) {
        const unlockUtterance = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(unlockUtterance);
      }

      if (peer) peer.destroy();
      peer = new Peer();

      peer.on('open', () => {
        const conn = peer.connect(target);
        conn.on('data', (data) => {
          tele = data;
        });

        const dummyCanvas = document.createElement('canvas');
        dummyCanvas.width = 1; dummyCanvas.height = 1;
        const call = peer.call(target, dummyCanvas.captureStream(1));

        call.on('stream', (remoteStream) => {
          video.srcObject = remoteStream;
          document.getElementById('bar').style.opacity = '0.35';
        });
      });
    });
  </script>
</body>
</html>
