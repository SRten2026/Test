<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drone FPV Receiver - Clean HUD</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <!-- Leaflet CSS & JS for Satellite Mini-Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; width: 100vw; height: 100vh; position: relative; font-family: monospace; }
    
    #video-wrapper {
      position: absolute; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; z-index: 1;
    }
    video {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.2s ease;
    }

    /* Minimal Top Bar */
    #bar {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(0, 0, 0, 0.75); padding: 6px 10px; border-radius: 4px; border: 1px solid #00ff00;
      display: flex; gap: 8px; align-items: center; transition: opacity 0.3s ease;
    }
    #bar:hover { opacity: 1 !important; }
    input, button { background: #111; color: #00ff00; border: 1px solid #00ff00; padding: 5px 8px; font-family: monospace; font-size: 12px; }
    button { cursor: pointer; font-weight: bold; }
    
    #status-indicator { font-size: 11px; font-weight: bold; padding: 3px 6px; border-radius: 2px; }
    .status-connected { color: #000; background: #00ff00; }
    .status-disconnected { color: #fff; background: #ff0000; }

    /* Telemetry Info Overlay (Bottom Left) */
    #telemetry-box {
      position: absolute; bottom: 15px; left: 15px; z-index: 10;
      background: rgba(0, 0, 0, 0.75); border: 1px solid #00ff00;
      border-radius: 4px; padding: 10px 14px; min-width: 180px;
      color: #00ff00; font-size: 13px; line-height: 1.6;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
    }
    .warn-battery { color: #ff3333 !important; font-weight: bold; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }

    /* Mini-Map Floating Box (Bottom Right) */
    #map-container {
      position: absolute; bottom: 15px; right: 15px; z-index: 10;
      width: 260px; height: 190px;
      border: 2px solid #00ff00; border-radius: 6px;
      overflow: hidden; box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
      background: #000; transition: width 0.3s, height 0.3s;
    }
    #map { width: 100%; height: 100%; }

    .drone-marker {
      display: flex; justify-content: center; align-items: center;
      transition: transform 0.1s linear;
    }
    .drone-marker svg {
      filter: drop-shadow(0 0 4px #00ff00);
    }
  </style>
</head>
<body>

  <!-- Minimal Top Controls -->
  <div id="bar">
    <input type="text" id="targetId" value="plane77" style="width: 75px;">
    <button id="connectBtn">CONNECT</button>
    <button id="rotateBtn" title="Rotate Camera">🔄 0°</button>
    <button id="mapToggleBtn" title="Toggle Map Size">🗺️ MAP: S</button>
    <span id="status-indicator" class="status-disconnected">DISCONNECTED</span>
  </div>

  <!-- Fullscreen FPV Video Feed -->
  <div id="video-wrapper">
    <video id="planeVideo" autoplay playsinline muted></video>
  </div>

  <!-- Telemetry Data Panel -->
  <div id="telemetry-box">
    <div>BATTERY: <span id="tele-battery">--%</span></div>
    <div>HEADING: <span id="tele-heading">--°</span></div>
    <div>GPS LAT: <span id="tele-lat">--</span></div>
    <div>GPS LON: <span id="tele-lon">--</span></div>
    <div>ALT    : <span id="tele-alt">-- m</span></div>
  </div>

  <!-- ArduPilot Style Satellite Mini-Map -->
  <div id="map-container">
    <div id="map"></div>
  </div>

  <script>
    const video = document.getElementById('planeVideo');
    const rotateBtn = document.getElementById('rotateBtn');
    const mapToggleBtn = document.getElementById('mapToggleBtn');
    const statusIndicator = document.getElementById('status-indicator');
    const mapContainer = document.getElementById('map-container');

    const elBattery = document.getElementById('tele-battery');
    const elHeading = document.getElementById('tele-heading');
    const elLat = document.getElementById('tele-lat');
    const elLon = document.getElementById('tele-lon');
    const elAlt = document.getElementById('tele-alt');

    let rawTele = { heading: 0, lat: 0, lon: 0, alt: 0, battery: 0, charging: false };
    let peer = null;
    let dataConn = null;
    let mediaCall = null;
    let rotationAngle = 0;
    let lastDataReceivedTime = 0;
    let reconnectTimer = null;

    // --- LEAFLET MINI-MAP SETUP ---
    let map = null;
    let droneMarker = null;
    let flightPath = null;
    let isMapExpanded = false;
    let mapInitialized = false;

    function initMap() {
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([22.5726, 88.3639], 16);

      // High-Res Satellite View
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
      }).addTo(map);

      // Drone Aircraft SVG Icon
      const droneSvg = `
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#00ff00">
          <path d="M12 2L4 21l8-4 8 4L12 2z"/>
        </svg>`;

      const customIcon = L.divIcon({
        className: 'drone-marker',
        html: `<div id="drone-icon-wrapper">${droneSvg}</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      droneMarker = L.marker([22.5726, 88.3639], { icon: customIcon }).addTo(map);
      flightPath = L.polyline([], { color: '#ffff00', weight: 2, opacity: 0.8 }).addTo(map);
    }
    initMap();

    // Map Resize Toggle
    mapToggleBtn.addEventListener('click', () => {
      isMapExpanded = !isMapExpanded;
      if (isMapExpanded) {
        mapContainer.style.width = '420px';
        mapContainer.style.height = '320px';
        mapToggleBtn.innerText = "🗺️ MAP: L";
      } else {
        mapContainer.style.width = '260px';
        mapContainer.style.height = '190px';
        mapToggleBtn.innerText = "🗺️ MAP: S";
      }
      setTimeout(() => { map.invalidateSize(); }, 350);
    });

    // Update Telemetry Panel & Map
    function updateHUD() {
      const isSignalAlive = (Date.now() - lastDataReceivedTime < 3500);

      if (!isSignalAlive && lastDataReceivedTime !== 0) {
        statusIndicator.innerText = "NO TELEMETRY";
        statusIndicator.className = "status-disconnected";
      }

      // 1. Update Telemetry Box
      let batText = rawTele.battery ? `${rawTele.battery}%` : '--%';
      if (rawTele.charging) batText += ' ⚡';
      elBattery.innerText = batText;

      if (rawTele.battery && rawTele.battery <= 20) {
        elBattery.className = 'warn-battery';
      } else {
        elBattery.className = '';
      }

      elHeading.innerText = `${Math.round(rawTele.heading || 0)}°`;
      elLat.innerText = rawTele.lat ? rawTele.lat.toFixed(5) : '--';
      elLon.innerText = rawTele.lon ? rawTele.lon.toFixed(5) : '--';
      elAlt.innerText = rawTele.alt ? `${rawTele.alt.toFixed(1)} m` : '-- m';

      // 2. Update Map Position & Drone Icon Heading
      if (rawTele.lat && rawTele.lon) {
        const pos = [rawTele.lat, rawTele.lon];
        if (!mapInitialized) {
          map.setView(pos, 17);
          mapInitialized = true;
        } else {
          map.panTo(pos);
        }

        droneMarker.setLatLng(pos);
        flightPath.addLatLng(pos);

        const iconWrapper = document.getElementById('drone-icon-wrapper');
        if (iconWrapper) {
          iconWrapper.style.transform = `rotate(${Math.round(rawTele.heading || 0)}deg)`;
        }
      }

      requestAnimationFrame(updateHUD);
    }
    updateHUD();

    // Rotate Camera Feed
    rotateBtn.addEventListener('click', () => {
      rotationAngle = (rotationAngle + 90) % 360;
      rotateBtn.innerText = `🔄 ${rotationAngle}°`;
      video.style.transform = `rotate(${rotationAngle}deg)`;
      
      if (rotationAngle === 90 || rotationAngle === 270) {
        video.style.width = '100vh';
        video.style.height = '100vw';
      } else {
        video.style.width = '100%';
        video.style.height = '100%';
      }
    });

    // Auto-Connect & PeerJS Logic
    function startConnection() {
      const target = document.getElementById('targetId').value.trim().toLowerCase();
      if (!target) return;

      statusIndicator.innerText = "CONNECTING...";
      statusIndicator.className = "status-disconnected";

      if (peer) peer.destroy();
      peer = new Peer();

      peer.on('open', () => {
        dataConn = peer.connect(target, { reliable: true });

        dataConn.on('open', () => {
          statusIndicator.innerText = "LIVE LINK";
          statusIndicator.className = "status-connected";
          document.getElementById('bar').style.opacity = '0.35';
          if (reconnectTimer) clearInterval(reconnectTimer);
        });

        dataConn.on('data', (data) => {
          rawTele = data;
          lastDataReceivedTime = Date.now();
        });

        dataConn.on('close', triggerReconnect);
        dataConn.on('error', triggerReconnect);

        const dummyCanvas = document.createElement('canvas');
        dummyCanvas.width = 1; dummyCanvas.height = 1;
        mediaCall = peer.call(target, dummyCanvas.captureStream(1));

        mediaCall.on('stream', (remoteStream) => {
          video.srcObject = remoteStream;
        });

        mediaCall.on('close', triggerReconnect);
        mediaCall.on('error', triggerReconnect);
      });

      peer.on('error', () => {
        triggerReconnect();
      });
    }

    function triggerReconnect() {
      statusIndicator.innerText = "RECONNECTING...";
      statusIndicator.className = "status-disconnected";
      if (!reconnectTimer) {
        reconnectTimer = setInterval(() => {
          startConnection();
        }, 4000);
      }
    }

    document.getElementById('connectBtn').addEventListener('click', () => {
      if (reconnectTimer) clearInterval(reconnectTimer);
      startConnection();
    });

    window.addEventListener('load', () => {
      setTimeout(startConnection, 1000);
    });
  </script>
</body>
</html>
