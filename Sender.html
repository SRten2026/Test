<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plane Sender (Headless)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #000; color: #00ff00; font-family: monospace; padding: 20px; text-align: center; }
    h2 { font-size: 18px; margin-bottom: 20px; }
    input, button { width: 100%; max-width: 400px; padding: 14px; margin: 8px auto; display: block; background: #111; color: #00ff00; border: 1px solid #00ff00; font-size: 16px; border-radius: 6px; font-family: monospace; }
    button { cursor: pointer; font-weight: bold; background: #002b00; }
    #stopBtn { background: #3a0d0d; color: #ff5555; border-color: #ff5555; display: none; }
    #status { margin-top: 20px; color: #ffeb3b; font-size: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>✈️ Plane Transmitter (No Preview)</h2>
  
  <input type="text" id="planeId" value="plane77" placeholder="Plane CallSign">
  <button id="startBtn">▶️ START TRANSMITTER</button>
  <button id="stopBtn">⏹️ STOP TRANSMITTER</button>

  <div id="status">Status: Standby</div>

  <script>
    let peer = null;
    let localStream = null;
    let dataInterval = null;
    let tele = { roll: 0, pitch: 0 };

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const planeInput = document.getElementById('planeId');

    // Gyro / Accelerometer
    window.addEventListener('deviceorientation', (e) => {
      let gamma = e.gamma || 0;
      let beta = e.beta || 0;

      if (window.orientation === 90) {
        tele.roll = -beta;
        tele.pitch = -gamma;
      } else if (window.orientation === -90) {
        tele.roll = beta;
        tele.pitch = gamma;
      } else {
        tele.roll = gamma;
        tele.pitch = beta;
      }
    });

    async function getCameraStream() {
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
          audio: false
        });
      } catch (err) {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
    }

    // START
    startBtn.addEventListener('click', async () => {
      const planeId = planeInput.value.trim().toLowerCase();
      if (!planeId) return alert('Enter Plane ID');

      statusDiv.innerText = "Accessing Camera...";

      try {
        localStream = await getCameraStream();

        peer = new Peer(planeId);

        peer.on('open', (id) => {
          statusDiv.innerText = `Online: [${id}] - Ready!`;
          statusDiv.style.color = '#00ff00';
          startBtn.style.display = 'none';
          stopBtn.style.display = 'block';
          planeInput.disabled = true;
        });

        peer.on('connection', (conn) => {
          if (dataInterval) clearInterval(dataInterval);
          dataInterval = setInterval(() => {
            if (conn && conn.open) conn.send(tele);
          }, 33);
        });

        peer.on('call', (call) => {
          call.answer(localStream);
          statusDiv.innerText = "Streaming Video Live (Background)";
        });

        peer.on('error', (err) => {
          statusDiv.innerText = "Error: " + err.type;
          statusDiv.style.color = '#ff4444';
        });

      } catch (err) {
        statusDiv.innerText = "Error: " + err.message;
        statusDiv.style.color = '#ff4444';
      }
    });

    // STOP
    stopBtn.addEventListener('click', () => {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      if (dataInterval) {
        clearInterval(dataInterval);
        dataInterval = null;
      }

      if (peer) {
        peer.destroy();
        peer = null;
      }

      statusDiv.innerText = "Transmitter Offline";
      statusDiv.style.color = '#ffeb3b';
      stopBtn.style.display = 'none';
      startBtn.style.display = 'block';
      planeInput.disabled = false;
    });
  </script>
</body>
</html>
