<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plane Sender</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; background: #222; color: #0f0; border: 1px solid #0f0; font-size: 16px; border-radius: 4px; }
    button { cursor: pointer; font-weight: bold; }
    #stopBtn { background: #3a0d0d; color: #ff5555; border-color: #ff5555; display: none; }
    #status { margin-top: 15px; color: #ffeb3b; font-size: 14px; }
  </style>
</head>
<body>

  <h2>✈️ Plane Transmitter</h2>
  <label>CallSign / Room ID:</label>
  <input type="text" id="planeId" value="plane77">
  
  <button id="startBtn">START CAMERA & TRANSMIT</button>
  <button id="stopBtn">⏹️ STOP TRANSMITTER</button>

  <div id="status">Status: Idle</div>

  <video id="preview" autoplay playsinline muted style="width: 100%; height: 180px; object-fit: cover; margin-top: 10px; border: 1px solid #333;"></video>

  <script>
    let peer = null;
    let localStream = null;
    let dataInterval = null;
    let tele = { roll: 0, pitch: 0 };

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusDiv = document.getElementById('status');
    const preview = document.getElementById('preview');

    window.addEventListener('deviceorientation', (e) => {
      let gamma = e.gamma || 0;
      let beta = e.beta || 0;

      if (window.orientation === 90) {
        tele.roll = -beta;
        tele.pitch = -gamma;
      } else if (window.orientation === -90) {
        tele.roll = beta;
        tele.pitch = gamma;
      } else {
        tele.roll = gamma;
        tele.pitch = beta;
      }
    });

    async function getCameraStream() {
      try {
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
          audio: false
        });
      } catch (err) {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
    }

    // 1. START TRANSMITTER
    startBtn.addEventListener('click', async () => {
      const planeId = document.getElementById('planeId').value.trim().toLowerCase();
      if (!planeId) return alert('Enter Plane ID');

      statusDiv.innerText = "Starting Camera...";

      try {
        localStream = await getCameraStream();
        preview.srcObject = localStream;

        peer = new Peer(planeId);

        peer.on('open', (id) => {
          statusDiv.innerText = `Online: [${id}] - Camera Active & Ready!`;
          statusDiv.style.color = '#0f0';
          startBtn.style.display = 'none';
          stopBtn.style.display = 'block';
          document.getElementById('planeId').disabled = true;
        });

        peer.on('connection', (conn) => {
          if (dataInterval) clearInterval(dataInterval);
          dataInterval = setInterval(() => {
            if (conn && conn.open) conn.send(tele);
          }, 33);
        });

        peer.on('call', (call) => {
          call.answer(localStream);
          statusDiv.innerText = "Streaming Video Live!";
        });

        peer.on('error', (err) => {
          statusDiv.innerText = "Error: " + err.type;
          statusDiv.style.color = '#ff4444';
        });

      } catch (err) {
        statusDiv.innerText = "Error: " + err.message;
        statusDiv.style.color = '#ff4444';
      }
    });

    // 2. STOP TRANSMITTER
    stopBtn.addEventListener('click', () => {
      // Stop Camera Tracks
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      preview.srcObject = null;

      // Stop Telemetry Interval
      if (dataInterval) {
        clearInterval(dataInterval);
        dataInterval = null;
      }

      // Destroy Peer Connection
      if (peer) {
        peer.destroy();
        peer = null;
      }

      // Reset UI
      statusDiv.innerText = "Transmitter Stopped (Offline)";
      statusDiv.style.color = '#ffeb3b';
      stopBtn.style.display = 'none';
      startBtn.style.display = 'block';
      document.getElementById('planeId').disabled = false;
    });
  </script>
</body>
</html>
