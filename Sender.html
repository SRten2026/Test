<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPV Advanced Transmitter</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { background: #0b0e14; color: #00ff66; font-family: monospace; padding: 15px; margin: 0; }
    .card { background: #151b26; border: 1px solid #1f293d; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    h2 { margin: 0 0 10px 0; font-size: 16px; color: #00ffcc; }
    input, button { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0; background: #0b0e14; color: #00ff66; border: 1px solid #00ff66; font-size: 14px; border-radius: 4px; font-family: monospace; }
    button { cursor: pointer; font-weight: bold; background: #00ff66; color: #000; }
    button.btn-sec { background: #1f293d; color: #00ffcc; border-color: #00ffcc; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
    .stat { background: #0b0e14; padding: 6px; border-radius: 4px; border: 1px solid #222; }
    #status { color: #ffeb3b; font-weight: bold; margin: 5px 0; }
  </style>
</head>
<body>

  <div class="card">
    <h2>✈️ FPV PLANE AVIONICS SENDER</h2>
    <label>Plane CallSign:</label>
    <input type="text" id="planeId" value="plane77">
    <button id="startBtn">1. START CAMERA & TRANSMITTER</button>
    <button id="setHomeBtn" class="btn-sec">📍 SET CURRENT LOCATION AS HOME</button>
    <div id="status">Status: Standby</div>
  </div>

  <div class="card">
    <h2>📡 SENSORS TELEMETRY (20Hz)</h2>
    <div class="grid">
      <div class="stat">ROLL: <span id="rVal">0</span>°</div>
      <div class="stat">PITCH: <span id="pVal">0</span>°</div>
      <div class="stat">SPEED: <span id="spdVal">0</span> km/h</div>
      <div class="stat">ALT: <span id="altVal">0</span> m</div>
      <div class="stat">BATT: <span id="batVal">--</span>%</div>
      <div class="stat">HDG: <span id="hdgVal">0</span>°</div>
    </div>
  </div>

  <video id="preview" autoplay playsinline muted style="width: 100%; height: 160px; object-fit: cover; border-radius: 6px; border: 1px solid #222;"></video>

  <script>
    let peer = null;
    let localStream = null;
    let homeLoc = null;

    let tele = {
      roll: 0, pitch: 0, alt: 0, speed: 0, heading: 0,
      lat: 0, lon: 0, batt: 100, homeDist: 0, homeBearing: 0
    };

    // Calculate Distance (Haversine Formula) & Bearing
    function calcHomeData(lat1, lon1, lat2, lon2) {
      if (!lat2 || !lon2) return { dist: 0, bearing: 0 };
      const R = 6371e3; // meters
      const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2)*Math.sin(Δφ/2) + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)*Math.sin(Δλ/2);
      const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
      let bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
      return { dist, bearing };
    }

    // 1. Phone IMU Gyro
    window.addEventListener('deviceorientation', (e) => {
      let g = e.gamma || 0, b = e.beta || 0;
      if (window.orientation === 90) { tele.roll = -b; tele.pitch = -g; }
      else if (window.orientation === -90) { tele.roll = b; tele.pitch = g; }
      else { tele.roll = g; tele.pitch = b; }

      document.getElementById('rVal').innerText = tele.roll.toFixed(1);
      document.getElementById('pVal').innerText = tele.pitch.toFixed(1);
    });

    // 2. High Accuracy GPS
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition((p) => {
        tele.lat = p.coords.latitude;
        tele.lon = p.coords.longitude;
        tele.alt = p.coords.altitude || 0;
        tele.speed = (p.coords.speed || 0) * 3.6;
        tele.heading = p.coords.heading || 0;

        if (homeLoc) {
          const nav = calcHomeData(tele.lat, tele.lon, homeLoc.lat, homeLoc.lon);
          tele.homeDist = nav.dist;
          tele.homeBearing = nav.bearing;
        }

        document.getElementById('spdVal').innerText = tele.speed.toFixed(0);
        document.getElementById('altVal').innerText = tele.alt.toFixed(0);
        document.getElementById('hdgVal').innerText = tele.heading.toFixed(0);
      }, (e) => console.log(e), { enableHighAccuracy: true, maximumAge: 0 });
    }

    // 3. Battery API
    if ('getBattery' in navigator) {
      navigator.getBattery().then(b => {
        const updateBatt = () => {
          tele.batt = Math.round(b.level * 100);
          document.getElementById('batVal').innerText = tele.batt;
        };
        updateBatt();
        b.addEventListener('levelchange', updateBatt);
      });
    }

    // Set Home button
    document.getElementById('setHomeBtn').addEventListener('click', () => {
      if (tele.lat && tele.lon) {
        homeLoc = { lat: tele.lat, lon: tele.lon };
        alert(`Home Point Locked!\nLat: ${tele.lat.toFixed(5)}\nLon: ${tele.lon.toFixed(5)}`);
      } else {
        alert("Waiting for GPS lock before setting Home!");
      }
    });

    // Start Video & WebRTC
    document.getElementById('startBtn').addEventListener('click', async () => {
      const planeId = document.getElementById('planeId').value.trim().toLowerCase();
      if (!planeId) return alert('Enter Plane ID');

      document.getElementById('status').innerText = "Starting Camera...";
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
          audio: false
        });
        document.getElementById('preview').srcObject = localStream;

        peer = new Peer(planeId);

        peer.on('open', (id) => {
          document.getElementById('status').innerText = `Online: [${id}] - Link Active`;
          document.getElementById('status').style.color = '#00ff66';
        });

        peer.on('connection', (conn) => {
          setInterval(() => {
            if (conn && conn.open) conn.send(tele);
          }, 50); // 20Hz update
        });

        peer.on('call', (call) => {
          call.answer(localStream);
          document.getElementById('status').innerText = "Transmitting Video + Telemetry Live!";
        });

      } catch (err) {
        document.getElementById('status').innerText = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
