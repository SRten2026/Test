<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Easy FPV - Drone Sender</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #00ff00; font-family: monospace; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    #video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
    #overlay { position: absolute; z-index: 2; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #00ff00; border-radius: 4px; font-size: 13px; line-height: 1.6; }
    #countdown-box { position: absolute; z-index: 10; font-size: 40px; font-weight: bold; background: rgba(0,0,0,0.85); padding: 20px 40px; border: 2px solid #00ff00; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>

  <video id="video" autoplay playsinline muted></video>

  <div id="countdown-box">
    STARTING IN <span id="timer">3</span>s
  </div>

  <div id="overlay">
    <div>DEVICE: <b>plane77</b></div>
    <div>STATUS: <span id="status">INITIALIZING...</span></div>
    <div>BATTERY: <span id="disp-battery">--%</span></div>
    <div>HDG: <span id="disp-heading">--°</span></div>
    <div>GPS: <span id="disp-gps">SEARCHING...</span></div>
  </div>

  <script>
    const video = document.getElementById('video');
    const statusText = document.getElementById('status');
    const timerText = document.getElementById('timer');
    const countdownBox = document.getElementById('countdown-box');
    const dispBattery = document.getElementById('disp-battery');
    const dispHeading = document.getElementById('disp-heading');
    const dispGps = document.getElementById('disp-gps');

    let peer = null;
    let localStream = null;
    let activeConn = null;

    let teleData = {
      heading: 0,
      lat: 0,
      lon: 0,
      alt: 0,
      battery: 0,
      charging: false
    };

    // ১. ফোনের ব্যাটারি পার্সেন্টেজ রিডিং
    if (navigator.getBattery) {
      navigator.getBattery().then((battery) => {
        function updateBattery() {
          teleData.battery = Math.round(battery.level * 100);
          teleData.charging = battery.charging;
          dispBattery.innerText = `${teleData.battery}% ${teleData.charging ? '⚡' : ''}`;
        }
        updateBattery();
        battery.addEventListener('levelchange', updateBattery);
        battery.addEventListener('chargingchange', updateBattery);
      }).catch(() => {});
    }

    // ২. কম্পাস ও হেডিং
    window.addEventListener('deviceorientation', (event) => {
      let hdg = 0;
      if (event.webkitCompassHeading) {
        hdg = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        hdg = 360 - event.alpha;
      }
      teleData.heading = Math.round(hdg);
      dispHeading.innerText = `${teleData.heading}°`;
    });

    // ৩. লাইভ জিপিএস
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          teleData.lat = pos.coords.latitude;
          teleData.lon = pos.coords.longitude;
          teleData.alt = pos.coords.altitude || 0;
          dispGps.innerText = `${teleData.lat.toFixed(4)}, ${teleData.lon.toFixed(4)}`;
        },
        () => {
          dispGps.innerText = "NO FIX";
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );
    }

    // ৪. ৩ সেকেন্ডের কাউন্টডাউন টাইমার
    let count = 3;
    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        timerText.innerText = count;
      } else {
        clearInterval(interval);
        countdownBox.style.display = 'none';
        initCameraAndPeer();
      }
    }, 1000);

    // ৫. ফ্রন্ট ক্যামেরা চালু (facingMode: 'user')
    async function initCameraAndPeer() {
      statusText.innerText = "STARTING FRONT CAMERA...";
      try {
        // ফ্রন্ট ক্যামেরা নিশ্চিত করতে facingMode: 'user'
        const constraints = {
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30 }
          },
          audio: false
        };

        try {
          localStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (e) {
          // কোনো হার্ডওয়্যার লিমিটেশন থাকলে সাধারণ ফ্রন্ট ক্যামেরা কল
          localStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false
          });
        }

        video.srcObject = localStream;
        statusText.innerText = "CONNECTING BROKER...";
        setupPeer();
      } catch (err) {
        statusText.innerText = "CAMERA ERROR: " + err.name;
      }
    }

    // ৬. PeerJS সেটআপ (plane77)
    function setupPeer() {
      if (peer) peer.destroy();
      peer = new Peer('plane77');

      peer.on('open', (id) => {
        statusText.innerText = "READY (plane77)";
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        statusText.innerText = "STREAMING LIVE";
      });

      peer.on('connection', (conn) => {
        activeConn = conn;
        statusText.innerText = "CLIENT LINKED";

        conn.on('close', () => {
          activeConn = null;
          statusText.innerText = "CLIENT DISCONNECTED";
        });
      });

      peer.on('error', (err) => {
        statusText.innerText = "PEER: " + err.type;
        if (err.type === 'unavailable-id') {
          setTimeout(setupPeer, 2500);
        }
      });
    }

    // প্রতি 100ms পরপর টেলিমেট্রি পাঠানো
    setInterval(() => {
      if (activeConn && activeConn.open) {
        activeConn.send(teleData);
      }
    }, 100);
  </script>
</body>
</html>
